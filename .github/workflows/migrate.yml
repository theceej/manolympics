name: Migrate Turso database

# Applies pending Drizzle migrations to the hosted Turso database. Runs when migration
# files change on main (so a schema change ships its tables), and can be run on demand.
on:
  push:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'src/lib/server/db/migrate.ts'
  workflow_dispatch:

# Never let two migration runs overlap.
concurrency:
  group: turso-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --omit=dev
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
